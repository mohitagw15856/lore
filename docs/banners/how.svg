<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="How it works">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient>
<style>.h{font:800 34px -apple-system,Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#fff}.sh{animation:sh 3s linear infinite}@keyframes sh{to{transform:translateX(1200px)}}</style></defs>
<rect width="1200" height="90" rx="20" fill="url(#g)"/>
<rect class="sh" x="-300" y="0" width="200" height="90" fill="#fff" opacity=".12" transform="skewX(-20)"/>
<text x="40" y="58" class="h">🧠  How it works</text>
</svg>
